# Chips inside a Mushroom chips card. Mushroom turns `type: X` into <mushroom-X-chip>,
# so `type: fully-tablet` (+ `chip:`) or the shorthand `type: fully-tablet-<kind>` is the chip.
# `tablet:` is optional: inside Fully it's this tablet, elsewhere the first one.
type: custom:mushroom-chips-card
alignment: center
chips:
  - type: fully-tablet
    chip: status                 # "60% · On"; tap opens the sheet, hold opens History
    name: Kitchen
    show: [battery, screen, app]
    tablets:                     # settings can ride on any chip (or on the button card)
      - name: Kitchen
        prefix: tabletkitchen
        plug: switch.kitchen_tablet_plug
  - type: fully-tablet-screen    # toggles the screen (natively when it runs on that tablet)
  - type: fully-tablet-battery   # battery icon + %; tap opens History
  - type: fully-tablet-app       # launches an Android app on the tablet (from the tablet or a phone)
    app_package: com.spotify.music
  - type: fully-tablet-app
    app_package: com.disney.disneyplus
    name: Disney+
    icon: mdi:television-play
  - type: fully-tablet-charger   # shows the smart plug; tap opens the Power section
  - type: fully-tablet-history
  - type: fully-tablet-open      # plain "Tablets" opener (Overview when there are several)
    name: Tablets
  - type: fully-tablet           # icon-only variant for a crowded phone row
    chip: status
    icon_only: true

